<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פעילות בחירה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ui.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" dir="rtl" lang="he" style="--font-display: 'Rubik', system-ui, sans-serif; --font-body: 'Rubik', system-ui, sans-serif">

<sc-if value="{{isContext}}" hint-placeholder-val="{{ true }}">
<div class="topbar"><button class="icon-btn" onClick="{{handBack}}" aria-label="סגירה"><span class="icon">close</span></button><span class="topbar-title muted">{{a.kicker}}</span><span class="topbar-spacer"></span></div>
<div class="screen center" style="justify-content: center; gap: 28px">
  <sc-if value="{{noCycle}}" hint-placeholder-val="{{ true }}">
    <div class="art" style="width: 240px; height: 240px">
      <div class="layer shape {{a.shape}} spin-slow" style="width: 240px; height: 240px; background: var(--cat-choice-c)"></div>
      <div class="layer shape shape-circle" style="width: 120px; height: 120px; background: var(--cat-choice)"></div>
      <span class="glyph icon icon-xl" style="color: #fff">{{a.icon}}</span>
    </div>
  </sc-if>
  <sc-if value="{{a.cycle}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; width: 300px; height: 300px">
      <div style="position: absolute; inset: 50px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--outline-variant)"></div>
      <div class="art" style="position: absolute; left: 105px; top: 105px; width: 90px; height: 90px">
        <div class="layer shape shape-cookie9" style="width: 90px; height: 90px; background: var(--surface-high)"></div>
        <span class="glyph icon icon-l muted">sync</span>
      </div>
      <sc-for list="{{cycle}}" as="c" hint-placeholder-count="6">
        <div class="stack center" style="position: absolute; left: {{c.x}}; top: {{c.y}}; width: 96px; gap: 2px; transform: translate(-50%, -50%)">
          <span style="width: {{c.size}}; height: {{c.size}}; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{c.bg}}; color: {{c.fg}}"><span class="icon">{{c.icon}}</span></span>
          <span class="t-label-s" style="color: {{c.label_c}}">{{c.label}}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <div class="stack center" style="gap: 10px">
    <h1 class="t-headline">{{a.title}}</h1>
    <p class="t-body-l muted">{{a.context}}</p>
  </div>
</div>
<div style="padding: 0 24px 24px"><button class="btn btn-filled btn-l btn-block" onClick="{{toChoose}}">בוחרים אחד</button></div>
</sc-if>

<sc-if value="{{isChoose}}" hint-placeholder-val="{{ false }}">
<div class="topbar"><button class="icon-btn" onClick="{{toContext}}" aria-label="חזרה"><span class="icon mirror-rtl">arrow_back</span></button><span class="topbar-title">מה מתאים היום?</span><span class="topbar-spacer"></span></div>
<div class="screen" style="padding-top: 8px; gap: 12px">
  <div class="stack scroll grow" style="gap: 10px; padding: 2px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <button class="list-row" onClick="{{o.pick}}" style="flex-shrink: 0; min-height: 100px">
        <span class="list-lead {{o.lead}}" style="width: 64px; height: 64px; border-radius: 20px"><span class="icon icon-l">{{o.icon}}</span></span>
        <span class="list-text">
          <span class="list-title">{{o.name}}</span>
          <span class="list-sub">{{o.len}} · {{o.why}}</span>
          <sc-if value="{{o.rated}}" hint-placeholder-val="{{ false }}">
            <span class="pill pill-amber" style="align-self: flex-start; margin-top: 6px; height: 28px"><span class="icon icon-s icon-fill">thumb_up</span>עזר בפעם הקודמת</span>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{isPractice}}" hint-placeholder-val="{{ false }}">
<div class="topbar"><button class="icon-btn" onClick="{{toChooseBack}}" aria-label="סגירה"><span class="icon">close</span></button><span class="topbar-title">{{chosen.name}}</span><span class="topbar-spacer"></span></div>
<div class="screen center" style="justify-content: center; gap: 28px">
  <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center">
    <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0" role="img" aria-label="{{remainingLabel}}">
      <circle cx="150" cy="150" r="140" fill="none" stroke="#DDE4E1" stroke-width="10"></circle>
      <circle cx="150" cy="150" r="140" fill="none" stroke="#2B6A62" stroke-width="10" stroke-linecap="round" stroke-dasharray="880" stroke-dashoffset="{{dash}}" transform="rotate(-90 150 150)"></circle>
    </svg>
    <div class="art" style="width: 230px; height: 230px">
      <div class="layer shape shape-cookie9 spin-slow" style="width: 230px; height: 230px; background: {{chosen.tint}}"></div>
      <div class="layer shape shape-circle" style="width: 150px; height: 150px; background: {{chosen.ink}}; animation: breathe 8s var(--ease) infinite; animation-play-state: {{animState}}"></div>
      <span class="glyph icon icon-xxl" style="color: #fff">{{chosen.icon}}</span>
    </div>
  </div>
  <p class="t-body-l">{{chosen.cue}}</p>
  <div class="row" style="justify-content: center; gap: 28px">
    <button class="icon-btn icon-btn-tonal" onClick="{{toClose}}" aria-label="עוצרים כאן"><span class="icon">stop</span></button>
    <button class="play-btn {{playCls}}" onClick="{{togglePause}}" aria-label="{{pauseLabel}}"><span class="icon icon-xl icon-fill">{{pauseIcon}}</span></button>
    <button class="icon-btn icon-btn-tonal" aria-label="הנחיה קולית"><span class="icon">record_voice_over</span></button>
  </div>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 0 24px 24px"><button class="btn btn-filled btn-block" onClick="{{toClose}}">סיום</button></div>
</sc-if>
</sc-if>

<sc-if value="{{isClose}}" hint-placeholder-val="{{ false }}">
<div class="screen center" style="padding-top: 64px; gap: 22px">
  <div class="art" style="width: 180px; height: 180px; animation: pop .7s var(--ease-emph)">
    <div class="layer shape shape-sunny spin-slow" style="width: 180px; height: 180px; background: var(--tertiary-container)"></div>
    <span class="glyph icon icon-xxl icon-fill" style="color: var(--on-tertiary-container)">{{closeIcon}}</span>
  </div>
  <h2 class="t-headline-s">{{closeTitle}}</h2>
  <sc-if value="{{a.hasOthers}}" hint-placeholder-val="{{ false }}">
    <div class="row" style="flex-wrap: wrap; justify-content: center; gap: 8px">
      <sc-for list="{{a.others}}" as="x" hint-placeholder-count="6">
        <span class="pill"><span class="icon icon-s">{{x.icon}}</span>{{x.label}}</span>
      </sc-for>
    </div>
  </sc-if>
  <div class="grow"></div>
  <div class="stack" style="width: 100%; gap: 10px">
    <span class="t-title-s">איך היה?</span>
    <div class="seg">
      <sc-for list="{{ratings}}" as="r" hint-placeholder-count="3">
        <button class="{{r.cls}}" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}">{{r.label}}</button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}"><button class="btn btn-filled btn-block" onClick="{{handBack}}">סיום</button></sc-if>
  <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}"><button class="btn btn-filled btn-block" onClick="{{restart}}">סיום</button></sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activity":{"editor":"enum","options":["Take a breather","In the moment","Relaxation","Unit 10 · Body tension"],"default":"In the moment"},"personalization":{"editor":"boolean","default":true},"practiceSeconds":{"editor":"int","min":3,"max":30,"default":8,"unit":"s","section":"Lab"},"onDone":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: 'context', pick: 0, t: 0, paused: false, early: false, rating: null };
  }
  componentDidMount() { this.timer = setInterval(() => this.tick(), 200); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    const s = this.state;
    if (s.screen === 'practice' && !s.paused && s.t < 1) this.setState({ t: Math.min(1, s.t + 0.2 / (this.props.practiceSeconds ?? 8)) });
  }
  data() {
    const br = { lead: 'lead-breath', tint: '#E1E59A', ink: '#5B5F1E' };
    const au = { lead: 'lead-audio', tint: '#B3EFE4', ink: '#2B6A62' };
    const ch = { lead: 'lead-choice', tint: '#FFD7F3', ink: '#7C4F73' };
    const o = (base, x) => Object.assign({}, base, x);
    return {
      'Take a breather': { kicker: 'לקחת רגע לנשום', title: 'הפסקת נשימה', icon: 'air', shape: 'shape-cookie4', cycle: false,
        context: 'אתם כבר מכירים כמה. בחרו אחת.',
        options: [
          o(br, { name: 'נשימה בטנית', len: '3 דקות', why: 'איטית ומרגיעה', icon: 'air', cue: 'הבטן עולה ויורדת.' }),
          o(br, { name: 'נשימת קופסה', len: '3 דקות', why: 'שאיפה, עצירה, נשיפה, עצירה', icon: 'crop_square', cue: 'שואפים בארבע. עוצרים. נושפים בארבע. עוצרים.' }),
          o(br, { name: 'נשימה קוהרנטית', len: '4 דקות', why: 'חלקה ואחידה', icon: 'waves', cue: 'נושמים פנימה והחוצה בקצב נוח.' }),
          o(br, { name: 'אנחה פיזיולוגית', len: 'דקה', why: 'שתי שאיפות, נשיפה ארוכה', icon: 'cloud', cue: 'שאיפה, עוד קצת שאיפה, ואז אנחה ארוכה החוצה.' })
        ], close: 'כל נשימה מאמנת מיומנות', others: [] },
      'In the moment': { kicker: 'כלים לרגע', title: 'כלים קטנים, הבדל גדול', icon: 'bolt', shape: 'shape-sunny', cycle: false,
        context: 'פחות מדקה. אפשר בכל מקום.',
        options: [
          o(ch, { name: 'איפוס בנשימה אחת', len: 'פחות מדקה', why: 'נשימה איטית אחת', icon: 'looks_one', cue: 'נשימה איטית אחת פנימה… ונשיפה ארוכה.' }),
          o(ch, { name: 'לרכך מקום אחד', len: 'דקה', why: 'להרפות נקודה מתוחה אחת', icon: 'spa', cue: 'מוצאים מקום מתוח אחד. נושפים. נותנים לו להתרכך.' }),
          o(ch, { name: 'שלושה עוגנים', len: 'דקה', why: 'רגליים, ידיים, צליל אחד', icon: 'anchor', cue: 'מרגישים את כפות הרגליים. שמים לב לידיים. מוצאים צליל אחד.' })
        ], close: 'נסו את זה עוד פעם היום', others: [] },
      'Relaxation': { kicker: 'הרפיה', title: 'להרגיע את הגוף', icon: 'self_improvement', shape: 'shape-flower', cycle: false,
        context: 'אין אחת הכי טובה. מה שמתאים היום.',
        options: [
          o(au, { name: 'הרפיית שרירים', len: '5 דקות', why: 'מכווצים ומשחררים', icon: 'accessibility_new', cue: 'מכווצים בעדינות… ומשחררים.' }),
          o(au, { name: 'דמיון מודרך מרגיע', len: '5 דקות', why: 'תמונה שמרגיעה', icon: 'landscape', cue: 'נותנים לתמונה להתבהר עוד קצת.' }),
          o(au, { name: 'מקום בטוח', len: '5 דקות', why: 'מקום יציב', icon: 'cottage', cue: 'שימו לב למה שאתם רואים ושומעים שם.' }),
          o(au, { name: 'קרקוע', len: '3 דקות', why: 'חזרה לחושים', icon: 'footprint', cue: 'הרצפה מתחתיכם יכולה לייצב.' })
        ], close: 'מנוחה יכולה להתחיל עוד לפני שהיום נגמר', others: [] },
      'Unit 10 · Body tension': { kicker: 'להגיב לקושי', title: 'מתח בגוף', icon: 'accessibility_new', shape: 'shape-cookie9', cycle: true,
        context: 'מקום אחד שבו אפשר להתערב.',
        options: [
          o(br, { name: 'נשימה בטנית', len: '3 דקות', why: 'להאט את הגוף', icon: 'air', cue: 'הבטן עולה ויורדת.' }),
          o(au, { name: 'הרפיית שרירים', len: '5 דקות', why: 'שחרור, אזור אחרי אזור', icon: 'accessibility_new', cue: 'מכווצים בעדינות… ומשחררים.' }),
          o(au, { name: 'דמיון מודרך מרגיע', len: '5 דקות', why: 'נינוחות ונוחות', icon: 'landscape', cue: 'נותנים לתמונה להתבהר עוד קצת.' }),
          o(ch, { name: 'לרכך מקום אחד', len: 'דקה', why: 'קטן ומהיר', icon: 'spa', cue: 'מוצאים מקום מתוח אחד. נותנים לו להתרכך.' }),
          o(ch, { name: 'מתיחות עדינות', len: '3 דקות', why: 'להקל על נוקשות', icon: 'sports_gymnastics', cue: 'זזים לאט. רק עד כמה שנוח.' })
        ], close: 'רגעים קטנים מצטברים',
        others: [{ icon: 'shower', label: 'מקלחת חמה' }, { icon: 'music_note', label: 'מוזיקה' }, { icon: 'park', label: 'טבע' }, { icon: 'sports_martial_arts', label: 'טאי צ׳י' }] }
    };
  }
  renderVals() {
    const s = this.state;
    const d = this.data();
    const a = d[this.props.activity ?? 'In the moment'] || d['In the moment'];
    const chosen = a.options[Math.min(s.pick, a.options.length - 1)];
    const perso = this.props.personalization ?? true;
    const done = s.t >= 1;
    const parts = [['קושי', 'bolt'], ['מחשבות', 'psychology'], ['קשב', 'visibility'], ['רגשות', 'mood_bad'], ['גוף', 'accessibility_new'], ['נסיגה', 'door_back']];
    const cycle = parts.map((p, i) => {
      const ang = -Math.PI / 2 + i * Math.PI / 3;
      const on = i === 4;
      return { label: p[0], icon: p[1], x: Math.round(150 + 112 * Math.cos(ang)) + 'px', y: Math.round(150 + 112 * Math.sin(ang)) + 'px',
        size: on ? '64px' : '48px', bg: on ? '#2B6A62' : '#E3EAE7', fg: on ? '#FFFFFF' : '#3F4946', label_c: on ? '#171D1B' : '#3F4946' };
    });
    const rl = [['עזר', 'thumb_up'], ['בסדר', 'thumbs_up_down'], ['לא היום', 'thumb_down']];
    return {
      embedded: !!this.props.onDone, standalone: !this.props.onDone, handBack: () => { if (this.props.onDone) this.props.onDone(); },
      a: Object.assign({}, a, { hasOthers: a.others.length > 0 }),
      noCycle: !a.cycle, cycle,
      isContext: s.screen === 'context', isChoose: s.screen === 'choose', isPractice: s.screen === 'practice', isClose: s.screen === 'close',
      toContext: () => this.setState({ screen: 'context' }),
      toChoose: () => this.setState({ screen: 'choose' }),
      toChooseBack: () => this.setState({ screen: 'choose', t: 0 }),
      options: a.options.map((o, i) => Object.assign({}, o, { rated: perso && i === 1, pick: () => this.setState({ screen: 'practice', pick: i, t: 0, paused: false, early: false, rating: null }) })),
      chosen, done,
      dash: String(Math.round(880 * (1 - s.t))),
      remainingLabel: Math.round(s.t * 100) + ' אחוז הושלמו',
      animState: s.paused || done ? 'paused' : 'running',
      togglePause: () => this.setState(done ? { t: 0, paused: false } : { paused: !s.paused }),
      pauseLabel: done ? 'שוב' : (s.paused ? 'המשך' : 'השהיה'),
      pauseIcon: done ? 'replay' : (s.paused ? 'play_arrow' : 'pause'),
      playCls: s.paused || done ? '' : 'is-playing',
      toClose: () => this.setState({ screen: 'close', early: !done }),
      closeIcon: s.early ? 'favorite' : 'check',
      closeTitle: s.early ? 'עשיתם את מה שהתאים היום' : a.close,
      ratings: rl.map((r, i) => ({ label: r[0], icon: r[1], pressed: s.rating === i ? 'true' : 'false', cls: s.rating === i ? 'is-selected' : '', pick: () => this.setState({ rating: i }) })),
      restart: () => this.setState({ screen: 'context', t: 0, rating: null, early: false })
    };
  }
}
</script>
</body>
</html>
