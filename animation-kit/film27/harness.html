<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#F3EEE4;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F3EEE4;--sans:'Rubik',system-ui,sans-serif}
.scene{position:absolute;inset:0;display:none}</style>
<style>#stage { --ground:#F3EEE4; --main:#2B6A62; --second:#1F2A33; --accent:#E8A33D; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:radial-gradient(110% 80% at 50% 30%, var(--ground), color-mix(in srgb, var(--ground) 90%, var(--accent))) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:16px; direction:rtl } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:54px; line-height:1.15; font-weight:600 } .sub { font-size:30px }
.tag { position:absolute; left:0; top:0; padding:10px 24px; border-radius:999px; background:color-mix(in srgb, var(--ground) 40%, white); color:var(--second); font-size:32px; font-weight:600; direction:rtl; white-space:nowrap; box-shadow:0 10px 24px -10px rgba(0,0,0,.25) }
.tag-warm { background:color-mix(in srgb, var(--accent) 22%, var(--ground)) }
.tag-cool { background:color-mix(in srgb, var(--main) 16%, var(--ground)) }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.cap { position:absolute; left:40px; right:40px; bottom:28px; padding:16px 26px; border-radius:22px; background:color-mix(in srgb, var(--second) 82%, transparent); color:var(--ground); font-size:27px; line-height:1.4; direction:rtl; text-align:center }
.wall-lo { fill:color-mix(in srgb, var(--ground) 90%, var(--second)) }
.floor { fill:color-mix(in srgb, var(--accent) 30%, var(--ground)) } .floor-dk { fill:color-mix(in srgb, var(--accent) 40%, var(--second) 12%) }
.ink { fill:none; stroke:var(--second); stroke-width:5; stroke-linecap:round; stroke-linejoin:round }
.skin { fill:color-mix(in srgb, var(--accent) 38%, var(--ground)) } .skin-dk { fill:color-mix(in srgb, var(--accent) 55%, var(--ground)) }
.hair { fill:color-mix(in srgb, var(--second) 28%, var(--ground)) } .hair-dk { fill:color-mix(in srgb, var(--second) 42%, var(--ground)) }
.knit { fill:var(--main) } .knit-dk { fill:color-mix(in srgb, var(--main) 72%, var(--second)) } .knit-lt { fill:color-mix(in srgb, var(--main) 70%, var(--ground)) }
.skirt { fill:color-mix(in srgb, var(--second) 75%, var(--main)) }
.chair { fill:color-mix(in srgb, var(--accent) 45%, var(--ground)) } .chair-dk { fill:color-mix(in srgb, var(--accent) 62%, var(--second) 14%) }
.wood { fill:color-mix(in srgb, var(--accent) 48%, var(--second) 22%) } .wood-lt { fill:color-mix(in srgb, var(--accent) 40%, var(--ground)) }
.glass { fill:color-mix(in srgb, var(--main) 22%, var(--ground)) } .leaf { fill:var(--main) } .leaf-lt { fill:color-mix(in srgb, var(--main) 65%, var(--ground)) }
.slate { fill:color-mix(in srgb, var(--second) 55%, var(--ground)) } .slate-dk { fill:color-mix(in srgb, var(--second) 75%, var(--ground)) }
.amber { fill:var(--accent) } .amber-dk { fill:color-mix(in srgb, var(--accent) 75%, var(--second)) } .amber-lt { fill:color-mix(in srgb, var(--accent) 45%, var(--ground)) }
.metal { fill:color-mix(in srgb, var(--second) 80%, var(--ground)) }
.shade { fill:rgba(0,0,0,.12) } .light { fill:color-mix(in srgb, var(--ground) 30%, white) }.sky { fill:color-mix(in srgb, var(--main) 14%, var(--ground)) } .hill-far { fill:color-mix(in srgb, var(--main) 30%, var(--ground)) } .hill-near { fill:color-mix(in srgb, var(--main) 45%, var(--ground)) }
.grass { fill:color-mix(in srgb, var(--main) 58%, var(--ground)) } .stone { fill:color-mix(in srgb, var(--accent) 22%, var(--ground)) } .stone-dk { fill:color-mix(in srgb, var(--accent) 30%, var(--second)) } .stone-lit { fill:var(--accent) }
.pack { fill:color-mix(in srgb, var(--accent) 60%, var(--second)) } .pack-dk { fill:color-mix(in srgb, var(--accent) 42%, var(--second)) } .pack-lt { fill:color-mix(in srgb, var(--accent) 70%, var(--ground)) }
.weight { fill:color-mix(in srgb, var(--second) 60%, var(--ground)) } .weight-dk { fill:color-mix(in srgb, var(--second) 78%, var(--ground)) }
.nira-skin { fill:color-mix(in srgb, color-mix(in srgb, var(--accent) 55%, var(--ground)) 82%, var(--second)) } .nira-skin-dk { fill:color-mix(in srgb, color-mix(in srgb, var(--accent) 60%, var(--ground)) 70%, var(--second)) }
.nira-hair { fill:color-mix(in srgb, var(--second) 82%, var(--accent)) } .nira-hair-dk { fill:var(--second) } .nira-top { fill:var(--accent) } .nira-top-dk { fill:color-mix(in srgb, var(--accent) 78%, var(--second)) } .nira-pants { fill:color-mix(in srgb, var(--second) 82%, var(--main)) }

.ariel-top { fill:#4E7FAA } .ariel-top-dk { fill:#3D6890 } .ariel-pants { fill:color-mix(in srgb, var(--second) 85%, #4E7FAA) } .ariel-hair { fill:#5B4034 } .ariel-scr { fill:color-mix(in srgb, #4E7FAA 22%, var(--ground)) }
.mat { fill:color-mix(in srgb, var(--main) 32%, var(--ground)) } .cushion { fill:color-mix(in srgb, var(--accent) 40%, var(--ground)) }
.voice-grey { fill:color-mix(in srgb, var(--second) 22%, var(--ground)) } .voice-warm { fill:color-mix(in srgb, var(--accent) 52%, var(--ground)) }
.thought { position:absolute; left:0; top:0; width:600px; box-sizing:border-box; padding:30px 38px; border-radius:34px; font-size:40px; line-height:1.3; font-weight:600; text-align:center; direction:rtl; color:var(--second); background:color-mix(in srgb, var(--second) 14%, var(--ground)); border:5px solid var(--second); box-shadow:0 18px 30px -16px rgba(0,0,0,.35) }
.thought.kind { background:color-mix(in srgb, var(--accent) 30%, var(--ground)) }
.thought.heavy { background:color-mix(in srgb, var(--second) 52%, var(--ground)); color:var(--ground) }
.btn { position:absolute; left:0; top:0; padding:16px 34px; border-radius:999px; font-size:34px; font-weight:600; direction:rtl; white-space:nowrap; border:4px solid var(--second); color:var(--second); background:color-mix(in srgb, var(--second) 12%, var(--ground)) }
.btn.keep { background:color-mix(in srgb, var(--accent) 34%, var(--ground)) }
.count { position:absolute; left:0; top:0; font-size:64px; font-weight:700; color:var(--second); direction:rtl; white-space:nowrap }
.struck { --s:0 } .struck::after { content:''; position:absolute; left:16px; right:16px; top:50%; height:5px; margin-top:-2px; border-radius:3px; background:#C0392B; transform:scaleX(var(--s)); transform-origin:100% 50% }
.thought.sm { width:440px; font-size:34px; padding:24px 30px }
.thought.xs { width:420px; font-size:33px; padding:20px 24px; border-width:4px; border-radius:28px }
.fra-top { fill:color-mix(in srgb, var(--main) 55%, #9CC5A1) } .fra-top-dk { fill:color-mix(in srgb, var(--main) 75%, #9CC5A1) } .fra-hair { fill:#6B4E3D } .fra-hair-dk { fill:#4E382B } .fra-pants { fill:color-mix(in srgb, var(--second) 80%, var(--main)) }
.frb-top { fill:#B07AA1 } .frb-top-dk { fill:#8E5F82 } .frb-hair { fill:#8A8F99 } .frb-hair-dk { fill:#6C7280 } .frb-pants { fill:color-mix(in srgb, var(--second) 85%, #B07AA1) }
.frg-top { fill:color-mix(in srgb, var(--second) 25%, var(--ground)) } .frg-top-dk { fill:color-mix(in srgb, var(--second) 35%, var(--ground)) } .frg-hair { fill:color-mix(in srgb, var(--second) 50%, var(--ground)) } .frg-hair-dk { fill:color-mix(in srgb, var(--second) 60%, var(--ground)) } .frg-pants { fill:color-mix(in srgb, var(--second) 45%, var(--ground)) }
/* session 27 extras */
.tag-night { background:color-mix(in srgb, #3A4870 30%, var(--ground)) }
</style></head><body><div id="stage"></div>
<script>
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const kit = {
  clamp01, seg: (t, a, b) => clamp01((t - a) / (b - a)), lerp: (a, b, p) => a + (b - a) * p,
  eo: (x) => 1 - Math.pow(1 - x, 3), ei: (x) => x * x * x,
  eio: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  eob: (x, s = 1.4) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
  breathe: (t, a = 0.012, p = 3.2) => 1 + a * Math.sin(2 * Math.PI * t / p),
  h: (s) => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
  css: (txt) => { const st = document.createElement('style'); st.textContent = txt; document.getElementById('stage').append(st); },
  defs: [], scene(id, o) { kit.defs.push([id, o]); },
};
</script>
<script>// Ruth's living room, Ruth herself, the spark and the scale: drawn once, reused by every scene so the world never changes between cuts.
// Stage is 1080 square. Effort sits on the RIGHT pan (where a Hebrew reader starts), reward on the LEFT.
window.CAPTIONS = true; // review captions; set false before exporting for the app, which shows its own
window.R = {
  PIV: [540, 175], ARM: 290,
  room(o) {
    o = o || {};
    let s = '<rect class="wall-lo" x="0" y="650" width="1080" height="210"/><rect class="shade" x="0" y="646" width="1080" height="6"/>' +
      '<rect class="floor" x="0" y="860" width="1080" height="220"/><rect class="floor-dk" x="0" y="860" width="1080" height="12"/>' +
      '<path class="floor-dk" opacity=".35" d="M0 940 H1080 V946 H0Z M0 1020 H1080 V1026 H0Z"/>' +
      '<rect class="wood-lt" x="62" y="322" width="246" height="236" rx="14"/><rect class="glass" x="80" y="340" width="210" height="200" rx="6"/>' +
      '<path class="light" opacity=".7" d="M100 520 L170 360 H200 L130 520Z"/><path class="wood-lt" d="M182 340 h8 v200 h-8Z M80 436 h210 v8 h-210Z"/>' +
      '<rect class="wood" x="52" y="552" width="266" height="16" rx="8"/>' +
      '<path class="knit-lt" d="M248 300 C276 380 262 470 300 590 L320 590 L322 300Z"/>';
    if (o.clock) s += '<g class="' + o.clock + '"><circle class="light" cx="540" cy="250" r="52"/><circle class="ink" cx="540" cy="250" r="52"/><circle class="metal" cx="540" cy="250" r="6"/></g>';
    if (o.open) s += '<rect class="amber-lt" x="820" y="450" width="190" height="410" rx="6"/><path class="light" opacity=".8" d="M820 860 L1010 860 L1080 1080 L700 1080Z"/><path class="wood" d="M820 450 L760 476 L760 860 L820 860Z"/>';
    else s += '<rect class="wood" x="820" y="450" width="190" height="410" rx="6"/><rect class="wood-lt" opacity=".55" x="848" y="482" width="134" height="150" rx="6"/><rect class="wood-lt" opacity=".55" x="848" y="660" width="134" height="170" rx="6"/><circle class="amber" cx="846" cy="668" r="10"/>';
    if (o.shoes !== false) s += '<g class="' + (o.shoes || 'shoes') + '">' + R.shoe(726, 858) + R.shoe(772, 860) + '</g>';
    if (o.plant !== false) s += R.plant();
    return s;
  },
  shoe(x, y) { return '<path class="slate-dk" d="M' + x + ' ' + y + ' q0 -26 22 -28 q14 0 18 12 l20 6 q10 4 8 10 Z"/><rect class="light" opacity=".5" x="' + (x + 6) + '" y="' + (y - 3) + '" width="56" height="3"/>'; },
  plant() {
    return '<g class="plant"><ellipse class="shade" cx="130" cy="862" rx="62" ry="10"/>' +
      '<path class="leaf" d="M130 770 C90 720 70 690 64 640 C100 660 122 700 130 770Z M130 770 C150 700 180 670 214 650 C206 700 172 740 130 770Z M130 770 C120 700 124 650 140 600 C156 650 150 710 130 770Z"/>' +
      '<path class="leaf-lt" d="M130 770 C108 730 96 700 92 668 C116 690 126 724 130 770Z"/>' +
      '<path class="amber-dk" d="M84 770 H176 L164 860 H96Z"/><rect class="amber" x="78" y="764" width="104" height="22" rx="6"/></g>';
  },
  chair() {
    return '<ellipse class="shade" cx="520" cy="864" rx="230" ry="16"/><rect class="chair-dk" x="352" y="820" width="18" height="42" rx="6"/><rect class="chair-dk" x="670" y="820" width="18" height="42" rx="6"/>' +
      '<path class="chair" d="M360 820 V600 Q360 552 410 552 H630 Q680 552 680 600 V820Z"/><path class="chair-dk" opacity=".45" d="M630 552 Q680 552 680 600 V820 H640 V600 Q640 566 630 552Z"/>' +
      '<rect class="chair" x="318" y="690" width="78" height="140" rx="34"/><rect class="chair" x="644" y="690" width="78" height="140" rx="34"/>' +
      '<rect class="chair-dk" x="380" y="736" width="280" height="90" rx="26"/>';
  },
  // Ruth, drawn around a local origin. pose: sit (origin = hips on the seat), stand / step / water (origin = between the feet), bend (origin = feet).
  ruth(id, pose) {
    const head = '<g class="' + id + '-head"><path class="hair-dk" d="M-58 -10 C-66 -70 -30 -102 4 -100 C44 -98 66 -66 58 -6 C56 18 44 30 36 34 L-40 34 C-52 26 -56 12 -58 -10Z"/>' +
      '<ellipse class="skin" cx="0" cy="-4" rx="44" ry="50"/><path class="hair" d="M-48 -16 C-48 -72 -6 -92 24 -84 C52 -76 58 -44 52 -22 C30 -44 -6 -54 -48 -16Z"/>' +
      '<g class="' + id + '-eyes"><circle class="metal" cx="-16" cy="-2" r="5"/><circle class="metal" cx="18" cy="-2" r="5"/></g>' +
      '<circle class="ink" style="stroke-width:3.5" cx="-16" cy="-2" r="15"/><circle class="ink" style="stroke-width:3.5" cx="18" cy="-2" r="15"/><path class="ink" style="stroke-width:3.5" d="M-1 -4 h4"/>' +
      '<ellipse class="skin-dk" opacity=".6" cx="-26" cy="20" rx="9" ry="5"/><ellipse class="skin-dk" opacity=".6" cx="30" cy="20" rx="9" ry="5"/>' +
      '<path class="ink ' + id + '-mouth" style="stroke-width:4" d="M-10 26 Q2 32 14 26"/></g>';
    const torso = '<path class="knit" d="M-72 0 C-78 -60 -74 -120 -56 -150 Q-30 -168 0 -168 Q30 -168 56 -150 C74 -120 78 -60 72 0Z"/>' +
      '<path class="knit-dk" opacity=".55" d="M30 -166 Q56 -152 62 -120 C72 -70 74 -30 72 0 H40 C46 -60 44 -120 30 -166Z"/><path class="light" opacity=".85" d="M-16 -168 L0 -120 L16 -168Z"/>' +
      '<circle class="knit-lt" cx="0" cy="-100" r="5"/><circle class="knit-lt" cx="0" cy="-70" r="5"/><circle class="knit-lt" cx="0" cy="-40" r="5"/>';
    const neck = '<rect class="skin-dk" x="-14" y="-186" width="28" height="24" rx="8"/>';
    if (pose === 'sit') {
      return '<g class="' + id + '-ruth"><path class="skirt" d="M-66 -6 C-30 -16 70 -14 118 4 L126 40 C80 52 -40 50 -70 34Z"/>' +
        '<path class="skin" d="M96 30 h26 l6 84 h-26Z M60 34 h26 l4 82 h-26Z"/><path class="slate-dk" d="M58 112 h40 q14 0 16 12 h-56Z M96 110 h40 q14 0 16 12 h-56Z"/>' +
        torso.replace(/0Z"/, '0Z"') + neck + '<g transform="translate(0 -218)">' + head + '</g>' +
        '<path class="knit" d="M-66 -140 C-92 -90 -80 -40 -30 -10 L-10 -30 C-46 -50 -52 -96 -40 -128Z"/><path class="knit" d="M66 -140 C92 -90 84 -40 40 -12 L22 -30 C52 -50 56 -96 42 -128Z"/>' +
        '<ellipse class="skin" cx="-12" cy="-22" rx="20" ry="14"/><ellipse class="skin" cx="22" cy="-24" rx="20" ry="14"/></g>';
    }
    const legs = pose === 'step' ? '<path class="skin" d="M-36 -200 l24 0 l-30 196 h-24Z M12 -200 l24 0 l36 192 h-24Z"/>' + R.shoe(-74, 2).replace('slate-dk', 'slate-dk') + R.shoe(40, 2)
      : '<path class="skin" d="M-34 -200 h26 l-2 196 h-26Z M8 -200 h26 l2 196 h-26Z"/>' + R.shoe(-48, 2) + R.shoe(0, 2);
    const arms = pose === 'water'
      ? '<path class="knit" d="M-60 -330 C-84 -280 -82 -230 -70 -196 L-50 -200 C-60 -240 -58 -280 -42 -316Z"/><path class="knit" d="M58 -330 C96 -320 128 -300 150 -270 L134 -254 C112 -280 88 -296 52 -300Z"/>' +
        '<g class="' + id + '-can"><path class="main-can glass" d="M130 -272 h70 l-6 64 h-58Z"/><path class="ink" style="stroke-width:4" d="M200 -258 L246 -236 M140 -272 q30 -30 54 0"/><rect class="knit-dk" x="130" y="-276" width="70" height="10" rx="4"/></g>'
      : '<path class="knit" d="M-60 -330 C-84 -280 -82 -230 -70 -196 L-50 -200 C-60 -240 -58 -280 -42 -316Z"/><path class="knit" d="M60 -330 C84 -280 82 -230 70 -196 L50 -200 C60 -240 58 -280 42 -316Z"/><ellipse class="skin" cx="-62" cy="-192" rx="14" ry="16"/><ellipse class="skin" cx="62" cy="-192" rx="14" ry="16"/>';
    const body = '<g transform="translate(0 -200)"><path class="skirt" d="M-64 -40 L64 -40 L80 40 L-80 40Z"/>' + torso.replace(/-168/g, '-168') + '</g>';
    const lean = pose === 'bend' ? ' transform="rotate(24 0 -200)"' : '';
    return '<g class="' + id + '-ruth"><ellipse class="shade" cx="0" cy="4" rx="80" ry="10"/>' + legs + '<g' + lean + '>' + body.replace('translate(0 -200)', 'translate(0 -200)') +
      '<g transform="translate(0 -200)">' + neck.replace('-186', '-186') + '</g><g transform="translate(0 -418)">' + head + '</g>' + arms + '</g></g>';
  },
  spark(id) {
    return '<g class="' + id + '-spark"><circle class="' + id + '-ring ink" style="stroke-width:4;stroke-dasharray:10 12" r="40"/>' +
      '<circle class="' + id + '-glow amber-lt" r="64" opacity=".5"/><path class="' + id + '-star amber" d="M0 -46 C6 -12 12 -6 46 0 C12 6 6 12 0 46 C-6 12 -12 6 -46 0 C-12 -6 -6 -12 0 -46Z"/></g>';
  },
  scale(id, right, left) {
    const pan = (k, items) => '<g class="' + id + '-pan' + k + '"><path class="ink" style="stroke-width:3" d="M0 0 L-92 150 M0 0 L92 150"/>' + (items || '') +
      '<path class="' + (k === 'R' ? 'slate' : 'amber') + '" d="M-110 150 H110 Q100 196 0 198 Q-100 196 -110 150Z"/><path class="' + (k === 'R' ? 'slate-dk' : 'amber-dk') + '" d="M-110 150 H110 Q108 160 104 166 H-104 Q-108 160 -110 150Z"/></g>';
    return '<g class="' + id + '-scale"><path class="metal" d="M532 175 h16 l10 150 h-36Z"/><rect class="metal" x="496" y="320" width="88" height="16" rx="8"/>' +
      pan('R', right) + pan('L', left) +
      '<g class="' + id + '-beam"><rect class="metal" x="240" y="166" width="600" height="18" rx="9"/><circle class="amber" cx="540" cy="175" r="16"/><circle class="metal" cx="540" cy="175" r="7"/></g></g>';
  },
  // effort blocks and reward tokens, drawn relative to a pan's hang point
  block(cls, x, w, h, y) { y = y == null ? 150 : y; return '<g class="' + cls + '"><rect class="slate-dk" x="' + (x - w / 2) + '" y="' + (y - h) + '" width="' + w + '" height="' + h + '" rx="10"/><rect class="slate" x="' + (x - w / 2 + 6) + '" y="' + (y - h + 6) + '" width="' + (w - 12) + '" height="' + (h / 2 - 6) + '" rx="6"/></g>'; },
  token(cls, kind, x, r) {
    const c = '<g class="' + cls + '"><g transform="translate(' + x + ' ' + (150 - r) + ')">';
    if (kind === 'heart') return c + '<path class="amber-dk" d="M0 ' + (r * .8) + ' C' + (-r * 1.3) + ' 0 ' + (-r * .7) + ' ' + (-r * 1.1) + ' 0 ' + (-r * .4) + ' C' + (r * .7) + ' ' + (-r * 1.1) + ' ' + (r * 1.3) + ' 0 0 ' + (r * .8) + 'Z"/></g></g>';
    if (kind === 'talk') return c + '<path class="light" d="M' + (-r) + ' ' + (-r * .7) + ' h' + (2 * r) + ' v' + (r * 1.2) + ' h' + (-r) + ' l' + (-r * .5) + ' ' + (r * .5) + ' v' + (-r * .5) + ' h' + (-r * .5) + 'Z"/><circle class="metal" cx="' + (-r * .4) + '" cy="' + (-r * .1) + '" r="' + (r * .12) + '"/><circle class="metal" cx="0" cy="' + (-r * .1) + '" r="' + (r * .12) + '"/><circle class="metal" cx="' + (r * .4) + '" cy="' + (-r * .1) + '" r="' + (r * .12) + '"/></g></g>';
    if (kind === 'compass') return c + '<circle class="leaf-lt" r="' + r + '"/><circle class="ink" style="stroke-width:4" r="' + r + '"/><path class="amber-dk" d="M0 ' + (-r * .75) + ' L' + (r * .22) + ' 0 L0 ' + (r * .75) + ' L' + (-r * .22) + ' 0Z"/></g></g>';
    return c + '<circle class="amber-lt" r="' + r + '"/><circle class="amber" r="' + (r * .55) + '"/></g></g>';
  },

  // the scale lives in a thought bubble above Ruth: a soft cloud behind it keeps the room quiet
  cloud(cls) {
    return '<g class="' + cls + '"><path class="shade" transform="translate(0 10)" d="M130 520 C60 520 36 446 80 404 C26 360 48 262 126 252 C114 150 220 96 300 126 C352 50 474 40 540 82 C606 40 730 50 780 126 C862 96 968 150 956 252 C1034 262 1054 360 1000 404 C1044 446 1020 520 950 520Z"/>' +
      '<path class="light" opacity=".92" d="M130 520 C60 520 36 446 80 404 C26 360 48 262 126 252 C114 150 220 96 300 126 C352 50 474 40 540 82 C606 40 730 50 780 126 C862 96 968 150 956 252 C1034 262 1054 360 1000 404 C1044 446 1020 520 950 520Z"/></g>';
  },
  // Ruth's head in side profile, facing right, with the top of the skull cut away to show the brain.

    return '<g class="' + id + '-voice"><path class="shade" transform="translate(0 8)" d="' + d + '"/><path class="' + id + '-grey voice-grey" d="' + d + '"/><path class="' + id + '-warm voice-warm" d="' + d + '" opacity="0"/>' +
      '<g class="' + id + '-eyes"><circle class="metal" cx="-6" cy="-14" r="6"/><circle class="metal" cx="26" cy="-14" r="6"/></g><path class="ink ' + id + '-mouth" style="stroke-width:5" d="M-2 4 Q10 10 22 4"/></g>';
  },
  // a centred transform for HTML pieces (thought cards, words): position, scale, rotation, opacity
  put(el, x, y, s, rot, o) { el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(' + (s == null ? 1 : s) + ') rotate(' + (rot || 0) + 'deg)'; if (o != null) el.style.opacity = o; },
  // the breathing pacer: a soft circle and n count dots below it (id-ring, id-core, id-d0..)
  pacer(id, n) {
    let s = '<g class="' + id + '-pacer"><circle class="' + id + '-ring" r="150" style="fill:var(--main);opacity:.12"/><circle class="' + id + '-core" r="110" style="fill:color-mix(in srgb, var(--main) 22%, var(--ground));stroke:var(--main);stroke-width:8"/>';
    for (let k = 0; k < (n || 5); k++) s += '<circle class="' + id + '-d' + k + '" cx="' + ((k - ((n || 5) - 1) / 2) * 44) + '" cy="200" r="14" style="fill:var(--ground);stroke:var(--second);stroke-width:4"/>';
    return s + '</g>';
  },
  // one day, morning on the right (sun) to evening on the left (moon): an ease curve that lifts after each pill
  dayLine(id, y, pills) {
    let s = '<g class="' + id + '-day"><rect class="metal" x="110" y="' + (y - 3) + '" width="860" height="6" rx="3"/>' +
      '<circle class="amber" cx="1000" cy="' + y + '" r="30"/><path class="slate" d="M84 ' + (y - 30) + ' a30 30 0 1 0 0 60 a40 40 0 0 1 0 -60Z"/>';
    (pills || []).forEach((x, k) => {
      s += '<g class="' + id + '-pill' + k + '" transform="translate(' + x + ' ' + (y + 46) + ')"><rect x="-30" y="-14" width="60" height="28" rx="14" style="fill:var(--ground);stroke:var(--second);stroke-width:4"/><path d="M-30 0 a14 14 0 0 1 14 -14 h14 v28 h-14 a14 14 0 0 1 -14 -14Z" style="fill:#D96C6C"/></g>';
    });
    s += '<path class="' + id + '-curve" pathLength="1" style="fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round" d="M970 ' + (y - 60) + ' C900 ' + (y - 250) + ' 840 ' + (y - 250) + ' 790 ' + (y - 120) + ' C750 ' + (y - 40) + ' 700 ' + (y - 260) + ' 610 ' + (y - 250) + ' C520 ' + (y - 240) + ' 500 ' + (y - 60) + ' 420 ' + (y - 80) + ' C340 ' + (y - 100) + ' 300 ' + (y - 220) + ' 230 ' + (y - 200) + ' C180 ' + (y - 186) + ' 150 ' + (y - 120) + ' 120 ' + (y - 110) + '"/></g>';
    return s;
  },
  // Ruth's upper body in side profile (facing right), the chest cut away: lung, diaphragm, belly front.
  // Animated parts: id-lung (scale), id-dia (moves down on the in-breath), id-belly (pushes out), id-air (in/out flow)
  torso(id) {
    return '<rect width="1080" height="1080" style="fill:color-mix(in srgb, var(--main) 14%, var(--ground))"/><circle cx="540" cy="560" r="470" style="fill:color-mix(in srgb, var(--ground) 70%, white)"/>' +
      // back and shoulders, cardigan
      '<path class="knit" d="M330 1080 L330 520 C330 420 380 360 470 350 L560 350 C640 356 690 400 700 470 L712 560 L712 1080Z"/>' +
      '<g class="' + id + '-belly"><path class="knit" d="M700 520 C760 600 790 700 780 800 C772 880 740 940 712 980 L640 980 L640 520Z"/></g>' +
      '<path class="knit-dk" opacity=".5" d="M330 520 C330 460 344 410 380 380 C360 450 356 560 370 1080 H330Z"/>' +
      // neck and head (side view), grey bob, glasses
      '<rect class="skin-dk" x="510" y="290" width="70" height="80" rx="20"/>' +
      '<path class="skin" d="M470 220 C470 130 540 90 600 100 C660 110 690 170 684 230 C700 250 706 262 694 270 L690 300 C688 330 660 340 630 338 C580 340 520 320 494 290 C474 270 470 246 470 220Z"/>' +
      '<path class="hair" d="M450 260 C430 150 500 70 590 76 C660 80 700 130 696 190 C660 150 610 140 570 160 C530 180 510 230 520 300 C490 300 460 290 450 260Z"/>' +
      '<ellipse class="light" opacity=".28" cx="652" cy="210" rx="30" ry="28"/><ellipse class="ink" style="stroke-width:6" cx="652" cy="210" rx="30" ry="28"/><path class="ink" style="stroke-width:6" d="M622 206 L560 200"/><circle class="metal" cx="658" cy="210" r="6"/>' +
      '<path class="ink" style="stroke-width:5" d="M664 296 q12 2 20 -6"/>' +
      // the cutaway window into the chest and belly
      '<clipPath id="' + id + '-clip"><path d="M400 430 C400 400 430 384 470 384 L600 384 C650 390 676 420 680 470 L690 860 C690 900 660 920 620 920 L460 920 C420 920 400 900 400 860Z"/></clipPath>' +
      '<path d="M394 424 C394 392 426 376 470 376 L600 376 C656 382 684 416 688 470 L698 860 C698 906 664 928 620 928 L460 928 C416 928 394 906 394 860Z" style="fill:color-mix(in srgb, var(--ground) 55%, white)"/>' +
      '<g clip-path="url(#' + id + '-clip)"><rect x="380" y="370" width="340" height="580" style="fill:color-mix(in srgb, var(--second) 78%, var(--main))"/>' +
      '<g class="' + id + '-lung"><path style="fill:#E9A3AE" d="M430 640 C410 560 430 450 500 420 C540 404 600 410 630 450 C660 500 660 590 650 650 C620 680 470 690 430 640Z"/>' +
      '<path style="fill:none;stroke:#C77985;stroke-width:6;stroke-linecap:round;opacity:.7" d="M540 400 V520 M540 470 C510 500 490 540 480 590 M540 480 C570 510 590 550 600 600"/></g>' +
      '<g class="' + id + '-dia"><path style="fill:none;stroke:#D9534F;stroke-width:16;stroke-linecap:round" d="M410 720 C450 650 620 640 680 716"/></g>' +
      '<g class="' + id + '-gut"><path class="amber-lt" opacity=".6" d="M420 780 C430 740 640 730 680 790 L690 920 H410Z"/></g></g>' +
      '<path d="M394 424 C394 392 426 376 470 376 L600 376 C656 382 684 416 688 470 L698 860 C698 906 664 928 620 928 L460 928 C416 928 394 906 394 860Z" style="fill:none;stroke:var(--second);stroke-width:6;opacity:.85"/>' +
      '<path class="' + id + '-air" pathLength="1" style="fill:none;stroke:var(--main);stroke-width:10;stroke-linecap:round;stroke-dasharray:.06 .06" d="M880 250 C820 250 760 258 700 270"/>';
  },

  // the armchair with Ruth seated in it, shifted dx to the side; Ruth's parts are id-head, id-eyes, id-mouth; id-body breathes
  seated(id, dx) {
    return '<g transform="translate(' + (dx || 0) + ' 0)">' + R.chair() + '<g transform="translate(500 742)"><g class="' + id + '-body">' + R.ruth(id, 'sit') + '</g></g></g>';
  },
  // a big phone filling the frame, for the game screens (screen 440 × 760, centred on x 540)
  bigPhone(id) {
    return '<g class="' + id + '-big"><rect class="shade" x="290" y="150" width="520" height="900" rx="64"/><rect class="metal" x="270" y="130" width="540" height="900" rx="64"/>' +
      '<rect x="300" y="190" width="480" height="790" rx="30" style="fill:color-mix(in srgb, var(--ground) 80%, white)"/><rect class="slate" x="490" y="150" width="100" height="14" rx="7"/></g>';
  },

  // ---- session 3a props ----
  // the circle of attention: a soft warm disc with a dashed rim, radius 1 (scale it)
  attn(id) {
    return '<g class="' + id + '-attn"><circle r="1" style="fill:var(--accent);opacity:.13"/><circle r="1" style="fill:none;stroke:var(--accent);stroke-width:.022;stroke-dasharray:.06 .05;opacity:.9"/></g>';
  },
  // three short wiggle lines beside a trembling hand (animate the group's transform to make them shiver)
  tremor(id) {
    return '<g class="' + id + '-trem">' + [0, 1, 2].map((k) => '<path class="ink" style="stroke-width:5;opacity:.7" d="M' + (20 + k * 6) + ' ' + (-26 + k * 26) + ' q8 -8 16 0 t16 0"/>').join('') + '</g>';
  },
  // the picture-perfect meditator, as a framed picture (centre 0,0; 260 × 300)
  perfect(id) {
    return '<g class="' + id + '-perfect"><rect class="shade" x="-122" y="-140" width="260" height="300" rx="20"/><rect x="-130" y="-150" width="260" height="300" rx="20" style="fill:color-mix(in srgb, var(--ground) 60%, white);stroke:var(--second);stroke-width:6"/>' +
      '<circle cx="0" cy="-30" r="96" style="fill:color-mix(in srgb, var(--main) 18%, var(--ground))"/>' +
      '<ellipse class="skin" cx="0" cy="-70" rx="26" ry="30"/><path class="leaf-lt" d="M-34 30 C-36 -10 -24 -36 0 -36 C24 -36 36 -10 34 30Z"/>' +
      '<path class="ink" style="stroke-width:4" d="M-10 -70 q4 3 8 0 M6 -70 q4 3 8 0"/><path class="slate-dk" d="M-26 -90 C-26 -110 26 -110 26 -90 C14 -100 -14 -100 -26 -90Z"/>' +
      '<path class="leaf" d="M-76 50 C-40 20 40 20 76 50 C40 62 -40 62 -76 50Z"/><path class="ink" style="stroke-width:5" d="M-30 0 L-58 38 M30 0 L58 38"/></g>';
  },
  // a practice-day card with weather: kind 'sun' | 'cloud' | 'mixed' (centre 0,0; 220 × 250)
  dayCard(id, kind) {
    const icon = {
      sun: '<circle class="amber" cx="0" cy="-30" r="46"/>' + [0, 1, 2, 3, 4, 5, 6, 7].map((k) => '<rect class="amber" x="-5" y="-108" width="10" height="20" rx="5" transform="rotate(' + k * 45 + ' 0 -30)"/>').join(''),
      cloud: '<path class="slate" d="M-62 0 C-84 0 -84 -36 -56 -38 C-56 -70 -10 -82 4 -56 C22 -76 64 -66 62 -34 C88 -32 88 0 62 0Z"/>',
      mixed: '<circle class="amber" cx="22" cy="-50" r="36"/><path style="fill:color-mix(in srgb, var(--second) 18%, var(--ground))" d="M-70 0 C-90 0 -90 -32 -64 -34 C-64 -62 -24 -72 -12 -48 C4 -66 40 -58 40 -30 C62 -28 62 0 40 0Z"/>',
    }[kind];
    return '<g class="' + id + '"><rect class="shade" x="-104" y="-116" width="220" height="250" rx="26"/><rect x="-110" y="-125" width="220" height="250" rx="26" style="fill:color-mix(in srgb, var(--ground) 50%, white);stroke:var(--second);stroke-width:6"/>' + icon + '</g>';
  },
  anchor(id) {
    return '<g class="' + id + '"><circle class="ink" style="stroke-width:10" cx="0" cy="-70" r="18"/><path class="ink" style="stroke-width:12" d="M0 -52 V40 M-30 -20 H30 M-56 0 C-50 40 -20 54 0 54 C20 54 50 40 56 0"/><path class="ink" style="stroke-width:10" d="M-66 10 L-56 -6 L-42 8 M66 10 L56 -6 L42 8"/></g>';
  },
  hourglass(id) {
    return '<g class="' + id + '"><rect class="wood" x="-70" y="-110" width="140" height="18" rx="9"/><rect class="wood" x="-70" y="92" width="140" height="18" rx="9"/>' +
      '<path d="M-54 -92 H54 C54 -30 12 -14 12 0 C12 14 54 30 54 92 H-54 C-54 30 -12 14 -12 0 C-12 -14 -54 -30 -54 -92Z" style="fill:color-mix(in srgb, var(--ground) 50%, white);stroke:var(--second);stroke-width:6"/>' +
      '<path class="amber" d="M-36 -64 H36 C30 -36 8 -24 0 -10 C-8 -24 -30 -36 -36 -64Z M-40 86 C-30 50 -10 40 0 34 C10 40 30 50 40 86Z"/></g>';
  },
  // a dial with a pointer (id-hand rotates about the centre)
  dial(id) {
    return '<g class="' + id + '"><circle class="shade" cx="4" cy="8" r="80"/><circle r="80" style="fill:color-mix(in srgb, var(--ground) 50%, white);stroke:var(--second);stroke-width:8"/>' +
      [0, 1, 2, 3, 4, 5, 6].map((k) => '<rect class="slate" x="-3" y="-72" width="6" height="16" rx="3" transform="rotate(' + (-90 + k * 30) + ')"/>').join('') +
      '<g class="' + id + '-hand"><path class="ink" style="stroke-width:10" d="M0 0 V-56"/></g><circle class="amber" r="14"/></g>';
  },
  // a reed that bends without breaking: flexibility, as a badge-sized icon
  reed(id) {
    return '<g class="' + id + '"><circle class="shade" cy="7" r="56"/><circle r="56" style="fill:color-mix(in srgb, var(--accent) 22%, var(--ground));stroke:var(--second);stroke-width:5"/>' +
      '<path class="' + id + '-stem" style="fill:none;stroke:var(--main);stroke-width:8;stroke-linecap:round" d="M0 40 C0 10 6 -16 20 -36"/><path class="leaf" d="M20 -36 C34 -40 40 -30 36 -22 C28 -22 22 -28 20 -36Z M4 0 C-14 -6 -22 4 -18 12 C-8 12 0 6 4 0Z"/></g>';
  },
  // a small lesson note (paper slip with two lines)
  note(id) {
    return '<g class="' + id + '"><rect class="shade" x="-38" y="-24" width="80" height="56" rx="8"/><rect x="-42" y="-30" width="84" height="58" rx="8" style="fill:color-mix(in srgb, var(--accent) 22%, white);stroke:var(--second);stroke-width:4"/>' +
      '<path class="ink" style="stroke-width:4;opacity:.6" d="M-26 -10 H26 M-26 6 H12"/></g>';
  },
  // a drifting thought, as a small cloud balloon with three dots
  balloon(id) {
    return '<g class="' + id + '"><path class="shade" transform="translate(0 6)" d="M-56 18 C-76 18 -76 -12 -52 -14 C-50 -42 -12 -50 0 -30 C14 -48 52 -40 50 -12 C72 -10 72 18 52 18Z"/>' +
      '<path style="fill:color-mix(in srgb, var(--ground) 40%, white);stroke:var(--second);stroke-width:5" d="M-56 18 C-76 18 -76 -12 -52 -14 C-50 -42 -12 -50 0 -30 C14 -48 52 -40 50 -12 C72 -10 72 18 52 18Z"/>' +
      '<circle class="metal" cx="-18" cy="0" r="6"/><circle class="metal" cx="2" cy="0" r="6"/><circle class="metal" cx="22" cy="0" r="6"/></g>';
  },
  bell(id) {
    return '<g class="' + id + '"><path class="amber" d="M-44 30 C-40 -10 -36 -50 0 -54 C36 -50 40 -10 44 30 L56 44 H-56Z"/><circle class="amber-dk" cx="0" cy="54" r="12"/><path class="ink" style="stroke-width:5;opacity:.6" d="M-74 -20 q-14 20 0 40 M74 -20 q14 20 0 40"/></g>';
  },
  calendar(id) {
    return '<g class="' + id + '"><rect x="-56" y="-50" width="112" height="104" rx="12" style="fill:color-mix(in srgb, var(--ground) 50%, white);stroke:var(--second);stroke-width:5"/><rect class="amber" x="-56" y="-50" width="112" height="28" rx="10"/>' +
      [0, 1, 2].map((r) => [0, 1, 2].map((c) => '<rect class="slate" x="' + (-36 + c * 28) + '" y="' + (-10 + r * 20) + '" width="16" height="10" rx="3"/>').join('')).join('') + '</g>';
  },
  // a wavy breath line as a path: x0..x0+w around y, amplitude, cycles, phase
  wavePath(x0, y, w, amp, k, ph) {
    let d = '';
    for (let i = 0; i <= 80; i++) { const x = x0 + w * i / 80, yy = y - amp * Math.sin((i / 80) * k * 2 * Math.PI + (ph || 0)); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + yy.toFixed(1); }
    return d;
  },

  // ---- session 3b ----
  // Ruth lying on the mat seen from above, right hand resting on her belly; returns markup (parts: id-armR, id-eyes, id-mouth)
  lying(id, p) {
    return R.overhead(p || id) + '<ellipse class="' + id + '-glow" cx="514" cy="547" rx="70" ry="56" style="fill:var(--main);opacity:0"/>' +
      '<g transform="translate(770 540) scale(1.25)">' + R.ruthTop(id) + '</g>';
  },
  // the hand on the belly; a = 0 (arm at her side) .. 1 (hand on belly); breath b = 0..1 lifts it a little
  handOn(arm, a, b) { arm.setAttribute('transform', 'rotate(' + (30 * a) + ' 52 -326) translate(' + (-6 * (b || 0)) + ' 0) scale(' + (1 + 0.05 * (b || 0)) + ')'); },
  // a tension meter (centre-bottom origin): id-fill is the level
  meter(id) {
    return '<g class="' + id + '"><rect x="-34" y="-290" width="68" height="290" rx="34" style="fill:color-mix(in srgb, var(--ground) 40%, white);stroke:var(--second);stroke-width:6"/>' +
      '<clipPath id="' + id + '-cl"><rect x="-26" y="-282" width="52" height="274" rx="26"/></clipPath><g clip-path="url(#' + id + '-cl)"><rect class="' + id + '-fill" x="-26" y="-282" width="52" height="274" style="fill:#D96C6C"/></g></g>';
  },
  stopSign(id) {
    return '<g class="' + id + '"><polygon points="-30,-72 30,-72 72,-30 72,30 30,72 -30,72 -72,30 -72,-30" style="fill:#C0392B;stroke:var(--ground);stroke-width:8"/><rect x="-44" y="-10" width="88" height="20" rx="10" style="fill:var(--ground)"/></g>';
  },
  // a soft blanket for the overhead view (covers her legs)
  blanket(id) {
    return '<g class="' + id + '"><rect x="0" y="-130" width="330" height="260" rx="40" style="fill:color-mix(in srgb, var(--accent) 55%, var(--ground))"/><path style="fill:none;stroke:color-mix(in srgb, var(--accent) 70%, var(--second));stroke-width:6;opacity:.5" d="M40 -130 V130 M110 -130 V130 M180 -130 V130 M250 -130 V130"/></g>';
  },
  swirl(id) {
    return '<path class="' + id + '" style="fill:none;stroke:var(--second);stroke-width:6;stroke-linecap:round;opacity:.7" d="M0 0 C10 -10 22 0 14 12 C4 24 -18 14 -16 -6 C-14 -28 16 -36 32 -16 C46 4 34 34 6 38"/>';
  },

  // ---- sessions 5–7 ----
  // an upright battery centred on (0,0), 120 × 200; set its level with R.setBattery(fill, level)
  battery(id) {
    return '<g class="' + id + '-bat"><rect class="shade" x="-54" y="-92" width="120" height="200" rx="26"/><rect x="-26" y="-118" width="52" height="26" rx="8" style="fill:var(--second)"/>' +
      '<rect x="-60" y="-100" width="120" height="200" rx="26" style="fill:color-mix(in srgb, var(--ground) 40%, white);stroke:var(--second);stroke-width:8"/>' +
      '<clipPath id="' + id + '-bc"><rect x="-46" y="-86" width="92" height="172" rx="16"/></clipPath><g clip-path="url(#' + id + '-bc)"><rect class="' + id + '-fill" x="-46" y="-86" width="92" height="172"/></g>' +
      '<path class="' + id + '-bolt" d="M8 -40 L-18 8 H0 L-8 44 L20 -4 H2Z" style="fill:var(--ground);opacity:0"/></g>';
  },
  setBattery(fill, level) {
    const l = Math.max(0, Math.min(1, level));
    fill.setAttribute('y', 86 - 172 * l); fill.setAttribute('height', 172 * l);
    fill.style.fill = l < 0.25 ? '#D96C6C' : l < 0.55 ? 'var(--accent)' : '#6FAE7A';
  },
  // two friends of Ruth's, drawn like Nira but in their own colours; look 'a' | 'b'
  friend(id, look, pose) {
    return R.nira(id, pose || 'stand').replace(/nira-top-dk/g, 'fr' + look + '-top-dk').replace(/nira-top/g, 'fr' + look + '-top').replace(/nira-hair-dk/g, 'fr' + look + '-hair-dk').replace(/nira-hair/g, 'fr' + look + '-hair').replace(/nira-pants/g, 'fr' + look + '-pants');
  },
  clock(id) {
    return '<g class="' + id + '"><circle class="shade" cx="4" cy="8" r="70"/><circle r="70" style="fill:color-mix(in srgb, var(--ground) 40%, white);stroke:var(--second);stroke-width:8"/>' +
      [0, 1, 2, 3].map((k) => '<rect class="slate" x="-4" y="-62" width="8" height="14" rx="4" transform="rotate(' + k * 90 + ')"/>').join('') +
      '<g class="' + id + '-h"><path class="ink" style="stroke-width:10" d="M0 0 V-32"/></g><g class="' + id + '-m"><path class="ink" style="stroke-width:7" d="M0 0 V-50"/></g><circle class="amber" r="9"/></g>';
  },
  mug(id) {
    return '<g class="' + id + '"><path class="ink" style="stroke-width:10" d="M40 -20 q30 0 30 24 q0 24 -30 24"/><rect x="-40" y="-44" width="84" height="92" rx="14" style="fill:color-mix(in srgb, var(--main) 40%, var(--ground));stroke:var(--second);stroke-width:6"/>' +
      '<path class="' + id + '-steam ink" style="stroke-width:6;opacity:.5" d="M-14 -60 q12 -16 0 -32 M12 -60 q12 -16 0 -32"/></g>';
  },
  star(id) {
    return '<path class="' + id + '" d="M0 -70 L20 -24 L68 -20 L32 12 L42 60 L0 34 L-42 60 L-32 12 L-68 -20 L-20 -24Z" style="fill:var(--accent);stroke:var(--second);stroke-width:6;stroke-linejoin:round"/>';
  },
  // small roots growing down from a point (draw them on with stroke-dasharray via id-r)
  roots(id) {
    return '<path class="' + id + '-r" pathLength="1" style="fill:none;stroke:color-mix(in srgb, var(--accent) 50%, var(--second));stroke-width:7;stroke-linecap:round" d="M-14 0 C-20 30 -50 40 -70 70 M-14 0 C-10 40 -24 70 -20 100 M14 0 C20 30 50 40 70 70 M14 0 C10 40 24 70 20 100 M-40 40 C-60 46 -76 44 -90 50 M40 40 C60 46 76 44 90 50"/>';
  },
  // a drifting thought on a dashed string back to Ruth's head (string drawn by the scene)
  phoneCall(id) {
    return '<g class="' + id + '"><rect class="shade" x="-50" y="-90" width="112" height="190" rx="20"/><rect x="-56" y="-98" width="112" height="190" rx="20" style="fill:var(--second)"/>' +
      '<rect x="-46" y="-84" width="92" height="156" rx="10" style="fill:color-mix(in srgb, var(--ground) 70%, white)"/><circle class="' + id + '-av" cx="0" cy="-36" r="24" style="fill:color-mix(in srgb, var(--main) 30%, var(--ground))"/>' +
      '<g class="' + id + '-tick"><path class="ink" style="stroke-width:6;stroke:var(--second);opacity:.5" d="M-20 30 L-8 42 L16 18"/></g><rect class="' + id + '-btn" x="-30" y="50" width="60" height="14" rx="7" style="fill:#6FAE7A"/></g>';
  },
};</script>
<script>// Session 27 additions: the evening room (window sky, floor lamp, night veil), Ruth's bed seen from above, small icons.
Object.assign(R, {
  // the window's sky over the room's glass: id-day / id-dusk / id-night layers cross-fade (set their opacity)
  sky(id) {

  let cur = live[live.length - 1];
  for (const sc of live) if (T < sc.start + sc.dur) { cur = sc; break; }
