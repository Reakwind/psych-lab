      toggleVoice: () => this.setState({ voiceOn: !voice }),
      voiceCls: voice ? 'is-selected' : '', voicePressed: voice ? 'true' : 'false', voiceIcon: voice ? 'volume_up' : 'volume_off',
      toggleCc: () => this.setState({ ccOn: !cc }),
      ccCls: cc ? 'is-selected' : '', ccPressed: cc ? 'true' : 'false'
    };
  }
}
</script>
</body>
</html>
