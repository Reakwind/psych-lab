<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מפגש 23: כלים לרגע</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="scene.css">
</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" dir="rtl" lang="he" style="--font-display: 'Rubik', system-ui, sans-serif; --font-body: 'Rubik', system-ui, sans-serif">
<audio ref="{{setAudio}}" src="{{audioSrc}}" preload="auto" onTimeUpdate="{{onTime}}" onEnded="{{onEnded}}"></audio>


<div class="topbar">

  <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}"><button class="icon-btn" onClick="{{exit}}" aria-label="סגירה"><span class="icon">close</span></button></sc-if>
  <span class="topbar-title"></span>
  <span class="where">מפגש {{meta.session}}</span>
</div>

<sc-if value="{{isIntro}}" hint-placeholder-val="{{ true }}">
<div class="screen" style="padding-top: 8px; gap: 20px">
  <div class="card card-white" style="padding: 0; overflow: hidden">
    <dc-import name="Scene" kind="{{first.kind}}" a="{{first.a}}" b="{{first.b}}" items="{{first.items}}" hint-size="342px,360px"></dc-import>
  </div>
  <div class="stack" style="gap: 6px">
    <h1 class="t-headline">{{meta.title}}</h1>
    <div class="row" style="gap: 8px; flex-wrap: wrap">
      <span class="pill"><span class="icon icon-s">record_voice_over</span>{{meta.who}}</span>
      <span class="pill"><span class="icon icon-s">schedule</span>{{meta.mins}} דקות</span>
    </div>
  </div>
  <div class="grow"></div>
  <div class="seg">
    <button class="{{voiceCls}}" onClick="{{toggleVoice}}" aria-pressed="{{voicePressed}}"><span class="icon icon-s">{{voiceIcon}}</span>קול</button>
    <button class="{{ccCls}}" onClick="{{toggleCc}}" aria-pressed="{{ccPressed}}"><span class="icon icon-s">closed_caption</span>כתוביות</button>
  </div>
  <button class="btn btn-filled btn-l btn-block" onClick="{{start}}"><span class="icon icon-fill">play_arrow</span>מתחילים</button>
</div>
</sc-if>

<sc-if value="{{isPlay}}" hint-placeholder-val="{{ false }}">
<div class="screen" style="padding-top: 4px; gap: 12px">
  <div key="{{sceneKey}}" class="card card-white" style="padding: 0; overflow: hidden; flex-shrink: 0; animation: enter .45s var(--ease-emph)">
    <dc-import name="Scene" kind="{{cur.kind}}" a="{{cur.a}}" b="{{cur.b}}" items="{{cur.items}}" paused="{{scenePaused}}" hint-size="342px,360px"></dc-import>
  </div>
  <div class="stack" style="gap: 0; margin-top: -6px; flex-shrink: 0">
    <div class="seekwrap">
      <input class="seek" type="range" min="0" max="{{total}}" step="0.1" value="{{tNow}}" onChange="{{onSeek}}" aria-label="מיקום בהקלטה" aria-valuetext="{{timeText}}" style="--p: {{seekPct}}">
      <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="12"><span class="seektick" style="inset-inline-start: {{tk.pos}}; background: {{tk.bg}}"></span></sc-for>
    </div>
    <div class="row" style="gap: 6px; min-height: 48px">
      <span class="where" dir="ltr" style="white-space: nowrap">{{elapsed}} / {{totalText}}</span>
      <span class="where" style="white-space: nowrap">· חלק {{partNo}} מתוך {{partCount}}</span>
      <span class="grow"></span>
      <span class="pill" title="{{srcLabel}}" aria-label="{{srcLabel}}" style="height: 30px; padding: 0 8px"><span class="icon" style="font-size: 18px">{{srcIcon}}</span></span>
      <button class="chip" onClick="{{cycleSpeed}}" aria-label="מהירות {{speedText}}" style="height: 48px; min-width: 76px; justify-content: center; gap: 4px"><span class="icon icon-s">speed</span><span dir="ltr">{{speedText}}</span></button>
    </div>
  </div>
  <div class="grow scroll">
    <sc-if value="{{cc}}" hint-placeholder-val="{{ true }}">
      <p class="t-body" style="font-size: 20px; line-height: 30px">{{cur.t}}</p>
    </sc-if>
  </div>
  <div class="row" style="justify-content: center; gap: 24px; flex-shrink: 0">
    <button class="icon-btn icon-btn-tonal" onClick="{{prev}}" aria-label="החלק הקודם" disabled="{{atFirst}}"><span class="icon">arrow_forward</span></button>
    <button class="play-btn {{playCls}}" onClick="{{toggle}}" aria-label="{{playLabel}}"><span class="icon icon-xl icon-fill {{playMirror}}">{{playIcon}}</span></button>
    <button class="icon-btn icon-btn-tonal" onClick="{{next}}" aria-label="החלק הבא"><span class="icon">arrow_back</span></button>
  </div>
</div>
</sc-if>

<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<div class="screen center" style="justify-content: center; gap: 22px">
  <div class="art" style="width: 200px; height: 200px; animation: pop .7s var(--ease-emph)">
    <div class="layer shape shape-sunny" style="width: 200px; height: 200px; background: var(--tertiary-container)"></div>
    <div class="layer shape shape-cookie9" style="width: 120px; height: 120px; background: var(--primary)"></div>
    <span class="glyph icon icon-xxl icon-fill" style="color: var(--on-primary)">check</span>
  </div>
  <h2 class="t-headline">סיימתם את המפגש</h2>
  <div class="grow"></div>
  <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
    <button class="btn btn-filled btn-l btn-block" onClick="{{finish}}">המשך<span class="icon">arrow_back</span></button>
    <button class="btn btn-tonal btn-block" onClick="{{replay}}"><span class="icon">replay</span>שוב</button>
  </sc-if>
  <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
    <div class="btn-group" style="width: 100%">
      <button class="btn btn-tonal" onClick="{{replay}}"><span class="icon">replay</span>שוב</button>
      <a class="btn btn-outlined" href="Ruth.dc.html" style="text-decoration: none">למסלול</a>
    </div>
  </sc-if>
</div>
</sc-if>

</div>
</x-dc>

      // a run of identical pictures keeps one key, so a breathing pacer runs on instead of restarting each part
      sceneKey: 'sc' + (() => { const same = (x, y) => x.kind === y.kind && (x.a || '') === (y.a || '') && (x.b || '') === (y.b || '') && JSON.stringify(x.items || []) === JSON.stringify(y.items || []); let k = Math.min(s.i, n - 1); while (k > 0 && same(this.S.scenes[k - 1], this.S.scenes[k])) k -= 1; return k; })(),
      segs: this.S.scenes.map((_, k) => ({ bg: k < s.i ? 'var(--primary)' : k === s.i ? 'var(--secondary)' : 'var(--surface-highest)', label: 'חלק ' + (k + 1), go: () => this.play(k) })),
      atFirst: s.i === 0,
      start: () => this.play(0),
      replay: () => this.play(0),
      prev: () => this.play(Math.max(0, s.i - 1)),
      next: () => (s.i < n - 1 ? this.play(s.i + 1) : (this.stop(), this.setState({ screen: 'end', playing: false }))),
      toggle: () => (s.playing ? (this.stop(), this.setState({ playing: false })) : this.play(s.i)),
      playIcon: s.playing ? 'pause' : 'play_arrow', playMirror: '', playCls: s.playing ? 'is-playing' : '',
      playLabel: s.playing ? 'השהיה' : 'המשך',
      toggleVoice: () => this.setState({ voiceOn: !voice }),
      voiceCls: voice ? 'is-selected' : '', voicePressed: voice ? 'true' : 'false', voiceIcon: voice ? 'volume_up' : 'volume_off',
      toggleCc: () => this.setState({ ccOn: !cc }),
      ccCls: cc ? 'is-selected' : '', ccPressed: cc ? 'true' : 'false'
    };
  }
}
</script>
